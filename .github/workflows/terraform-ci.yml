name: Terraform CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize VPC module
        run: terraform -chdir=modules/vpc init -backend=false

      - name: Validate VPC module
        run: terraform -chdir=modules/vpc validate

      - name: Test VPC module
        run: terraform -chdir=modules/vpc test

      - name: Initialize S3 module
        run: terraform -chdir=modules/s3-bucket init -backend=false

      - name: Validate S3 module
        run: terraform -chdir=modules/s3-bucket validate

      - name: Initialize IAM module
        run: terraform -chdir=modules/iam-role init -backend=false

      - name: Validate IAM module
        run: terraform -chdir=modules/iam-role validate

      - name: Initialize development environment
        run: terraform -chdir=environments/dev init -backend=false

      - name: Validate development environment
        run: terraform -chdir=environments/dev validate
  terraform-security:
    name: Terraform Lint and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint plugins
        run: tflint --init

      - name: Lint Terraform
        run: tflint --recursive

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Scan Terraform security
        run: checkov --directory . --framework terraform --soft-fail